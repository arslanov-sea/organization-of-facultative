{% extends "base.html" %}

{% block title %}Добавить студента - {{ university }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h4 class="card-title mb-0">Добавить нового студента - {{ university }}</h4>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('add_student_submit', university=university) }}" id="addStudentForm">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="last_name" class="form-label">Фамилия *</label>
                                <input type="text" class="form-control" id="last_name" name="last_name" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="first_name" class="form-label">Имя *</label>
                                <input type="text" class="form-control" id="first_name" name="first_name" required>
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="patronymic" class="form-label">Отчество</label>
                        <input type="text" class="form-control" id="patronymic" name="patronymic">
                        <div class="form-text">Необязательное поле</div>
                    </div>

                    <div class="mb-3">
                        <label for="address" class="form-label">Адрес *</label>
                        <textarea class="form-control" id="address" name="address" rows="3" required></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="phone" class="form-label">Телефон *</label>
                        <input type="tel" class="form-control" id="phone" name="phone" required>
                    </div>

                    <div class="mb-3">
                        <label for="min_required_facultative_hours" class="form-label">
                            Минимальное количество факультативных часов
                        </label>
                        <input type="number" class="form-control" id="min_required_facultative_hours"
                               name="min_required_facultative_hours" min="0" step="1">
                        <div class="form-text">Необязательное поле. Введите целое число</div>
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="{{ url_for('index', university=university) }}" class="btn btn-secondary me-md-2">
                            Отмена
                        </a>
                        <button type="submit" class="btn btn-primary">
                            Добавить студента
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
